${P.map(p=>{const k=p[0]=="احترافية";return`<div class="c" style="${k?"background:#14201A;color:#fff":""}"><h2>${p[0]} — ${Math.round(p[1]*(S.yr?.8:1)).toLocaleString("en-US")}ج</h2><button class="b g" ${go("signup")}>ابدأ تجربة 7 أيام مجاناً</button><button class="b" style="${k?"background:none;color:#fff;border-color:#fff":""}" ${go("store")}>شاهد المنيو بهذه الباقة</button></div>`}).join("")}
